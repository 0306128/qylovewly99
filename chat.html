<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>祁煜 · 传讯</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0b0b10;
            color: #e8e8ed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
        }
        #app {
            max-width: 480px;
            width: 100%;
            height: 100vh;
            max-height: 860px;
            background: #121217;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: 0;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        /* 顶栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #1a1a1e;
            border-bottom: 1px solid #2a2a2e;
            flex-shrink: 0;
        }
        .header .name { font-size: 17px; font-weight: 600; color: #fff; }
        .header .status { font-size: 12px; color: #7a8a9a; display: flex; align-items: center; gap: 6px; }
        .header .status .dot { width: 8px; height: 8px; background: #44cf6c; border-radius: 50%; display: inline-block; }
        .header-actions { display: flex; gap: 8px; }
        .header-actions button {
            background: transparent; border: none; color: #8a9aaa;
            font-size: 16px; cursor: pointer; padding: 4px 6px;
            transition: 0.2s;
        }
        .header-actions button:hover { color: #c5a47e; }

        /* 聊天区域 */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #121217;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
        }
        .message.left { align-self: flex-start; background: #26262b; color: #e8e8ed; border-bottom-left-radius: 6px; }
        .message.right { align-self: flex-end; background: #2b6c8f; color: #fff; border-bottom-right-radius: 6px; }
        .message.system {
            align-self: center;
            background: transparent;
            color: #6a7a8a;
            font-size: 12px;
            padding: 4px 0;
            text-align: center;
        }
        .message .time { font-size: 10px; color: #7a7a84; margin-top: 4px; display: block; text-align: right; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }

        /* 输入区域 */
        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px 12px;
            background: #1a1a1e;
            border-top: 1px solid #2a2a2e;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 24px;
            border: none;
            background: #2a2a2f;
            color: #f0f0f5;
            font-size: 15px;
            outline: none;
        }
        .input-area input::placeholder { color: #5e6a7a; }
        .input-area .btn-send {
            background: #2b6c8f;
            color: #fff;
            padding: 8px 18px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            cursor: pointer;
        }
        .input-area .btn-send:active { opacity: 0.7; }
        .input-area .ai-toggle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.2);
            background: transparent;
            color: #c5a47e;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .input-area .ai-toggle:hover {
            border-color: rgba(197,164,126,0.6);
            box-shadow: 0 0 12px rgba(197,164,126,0.15);
        }

        /* ===== 统一收纳盒 ===== */
        .fun-drawer {
            background: #1a1a1e;
            border-radius: 16px;
            padding: 12px 14px 12px;
            margin: 4px 12px 4px;
            border: 1px solid #2a2a2e;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .fun-drawer .fd-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .fun-drawer .fd-header span { color: #aaa; font-size: 12px; font-weight: 500; }
        .fun-drawer .fd-header button { background: transparent; border: none; color: #666; font-size: 14px; cursor: pointer; }
        .fun-drawer .fd-tabs {
            display: flex;
            gap: 3px;
            border-bottom: 1px solid #2a2a2e;
            padding-bottom: 5px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .fun-drawer .fd-tab {
            background: transparent; border: none; color: #888;
            font-size: 11px; padding: 3px 8px; cursor: pointer;
            border-radius: 12px; transition: 0.2s;
        }
        .fun-drawer .fd-tab.active { color: #c5a47e; background: rgba(197,164,126,0.1); }
        .fun-drawer .fd-panel { display: none; }
        .fun-drawer .fd-panel.active { display: block; }

        /* 猜拳 */
        .fd-rps { display: flex; justify-content: center; gap: 10px; }
        .fd-rps button {
            width: 44px; height: 44px; border-radius: 50%;
            border: 2px solid #2a2a2e; background: #121217;
            color: #eee; font-size: 20px; cursor: pointer;
            transition: 0.2s;
        }
        .fd-rps button:hover { border-color: #c5a47e; }
        .fd-result { text-align: center; margin-top: 6px; font-size: 13px; color: #c5a47e; min-height: 20px; }

        /* 数字炸弹 */
        .fd-row { display: flex; gap: 5px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .fd-input {
            width: 80px; padding: 5px 8px; border-radius: 14px;
            border: 1px solid #2a2a2e; background: #121217;
            color: #eee; outline: none; font-size: 12px;
        }
        .fd-btn {
            padding: 5px 12px; border-radius: 14px; border: none;
            font-weight: 600; cursor: pointer; font-size: 11px;
        }
        .fd-btn-primary { background: #c5a47e; color: #fff; }
        .fd-btn-secondary { background: transparent; border: 1px solid #2a2a2e; color: #888; }

        /* 五子棋 */
        .fd-board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 1px;
            max-width: 240px;
            margin: 0 auto;
            background: #121217;
            padding: 4px;
            border-radius: 8px;
        }
        .fd-cell {
            aspect-ratio: 1;
            background: #1a1a1e;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }
        .fd-cell:hover { background: #26262b; }
        .fd-info { text-align: center; color: #888; font-size: 12px; margin-bottom: 4px; }
        .fd-info span { color: #c5a47e; font-weight: 600; }

        /* 朋友圈 */
        .fd-moments-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
        }
        .fd-moments-list .moment-item {
            background: #121217; border-radius: 10px;
            padding: 8px 10px; border: 1px solid #2a2a2e;
        }
        .fd-moments-list .moment-item .moment-text { font-size: 12px; color: #ddd; }
        .fd-moments-list .moment-item .moment-time { font-size: 9px; color: #666; margin-top: 2px; display: block; }
        .fd-moments-list .moment-item .moment-img {
            max-width: 100%; max-height: 80px; border-radius: 6px;
            margin-top: 4px; display: block;
        }
        .fd-moments-input-row {
            display: flex; gap: 5px; align-items: center;
        }
        .fd-moments-input-row input[type="text"] {
            flex: 1; padding: 5px 10px; border-radius: 14px;
            border: 1px solid #2a2a2e; background: #121217;
            color: #eee; outline: none; font-size: 12px;
        }
        .fd-moments-input-row input[type="file"] { display: none; }

        /* 红包 */
        .fd-redpacket-preview {
            background: #121217; border-radius: 10px;
            padding: 8px 12px; border: 1px solid #2a2a2e;
            text-align: center; margin-bottom: 6px;
        }
        .fd-redpacket-preview .rp-amount { font-size: 20px; font-weight: 700; color: #c5a47e; }
        .fd-redpacket-preview .rp-label { font-size: 11px; color: #888; margin-top: 2px; }
    </style>
</head>
<body>
<div id="app">
    <!-- 顶栏 -->
    <div class="header">
        <span class="name">祁煜</span>
        <div class="status"><span class="dot"></span> 在线</div>
        <div class="header-actions">
            <button id="themeToggle" title="切换主题"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <!-- 聊天区域 -->
    <div class="chat-box" id="chatBox">
        <div class="message system">✦ 你们的对话从这里开始 ✦</div>
    </div>

    <!-- ===== 统一收纳盒 ===== -->
    <div class="fun-drawer" id="funDrawer">
        <div class="fd-header">
            <span>🎮 小游戏 · 📱 朋友圈 · 🧧 红包</span>
            <button id="fdClose">✕</button>
        </div>
        <div class="fd-tabs">
            <button class="fd-tab active" data-tab="rps">✊ 猜拳</button>
            <button class="fd-tab" data-tab="bomb">💣 炸弹</button>
            <button class="fd-tab" data-tab="goban">⚫ 五子棋</button>
            <button class="fd-tab" data-tab="moments">📱 朋友圈</button>
            <button class="fd-tab" data-tab="redpacket">🧧 红包</button>
        </div>

        <!-- 猜拳 -->
        <div class="fd-panel active" id="fdRps">
            <div style="text-align:center;color:#888;font-size:11px;margin-bottom:4px;">选一个</div>
            <div class="fd-rps">
                <button data-move="rock">✊</button>
                <button data-move="scissors">✌️</button>
                <button data-move="paper">🖐️</button>
            </div>
            <div class="fd-result" id="rpsResult"></div>
        </div>

        <!-- 数字炸弹 -->
        <div class="fd-panel" id="fdBomb">
            <div style="text-align:center;color:#888;font-size:11px;">
                范围：<span id="bombRange" style="color:#c5a47e;font-weight:600;">1 ~ 100</span>
            </div>
            <div class="fd-row" style="margin-top:4px;">
                <input class="fd-input" id="bombInput" type="number" min="1" max="100" placeholder="猜">
                <button class="fd-btn fd-btn-primary" id="bombGuess">猜</button>
                <button class="fd-btn fd-btn-secondary" id="bombReset">重置</button>
            </div>
            <div class="fd-result" id="bombResult"></div>
        </div>

        <!-- 五子棋 -->
        <div class="fd-panel" id="fdGoban">
            <div class="fd-info">
                <span id="gobanTurn">你的回合</span>
                <button class="fd-btn fd-btn-secondary" id="gobanReset" style="margin-left:6px;padding:2px 8px;font-size:9px;">重开</button>
            </div>
            <div class="fd-board" id="gobanBoard"></div>
        </div>

        <!-- 朋友圈 -->
        <div class="fd-panel" id="fdMoments">
            <div class="fd-moments-list" id="momentsList"></div>
            <div class="fd-moments-input-row">
                <input type="text" id="momentInput" placeholder="写点什么…" />
                <button class="fd-btn fd-btn-secondary" id="momentImgBtn">📎</button>
                <input type="file" id="momentFileInput" accept="image/*" />
                <button class="fd-btn fd-btn-primary" id="momentSendBtn">发布</button>
            </div>
        </div>

        <!-- 红包 -->
        <div class="fd-panel" id="fdRedpacket">
            <div class="fd-redpacket-preview">
                <div class="rp-amount" id="rpAmountDisplay">¥ 0.00</div>
                <div class="rp-label">输入金额，点击发送</div>
            </div>
            <div class="fd-row">
                <input class="fd-input" id="rpInput" type="number" min="0.01" step="0.01" placeholder="金额" style="width:100px;" />
                <button class="fd-btn fd-btn-primary" id="rpSendBtn">🧧 发红包</button>
            </div>
        </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
        <button class="ai-toggle" id="aiToggleBtn" title="切换回复模式">📖</button>
        <input type="text" id="msgInput" placeholder="说点什么…" />
        <button class="btn-send" id="sendBtn">发送</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ===== DOM引用 =====
    const chatBox = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const aiToggle = document.getElementById('aiToggleBtn');

    // ===== 发送消息 =====
    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = 'message ' + type;
        div.textContent = text;
        const time = document.createElement('span');
        time.className = 'time';
        const now = new Date();
        time.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        div.appendChild(time);
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        addMessage(text, 'right');
        msgInput.value = '';

        // 模拟回复
        const replies = [
            '嗯，我在听呢。',
            '……你说，我在这。',
            '宝宝，你继续说。',
            '我刚刚在想你。',
            '今天累不累？',
            '你说话的声音真好听。',
            '我一直在呢。',
            '……你最近话变少了。',
            '想你了哦。',
            '你开心我就开心。'
        ];
        setTimeout(() => {
            const reply = replies[Math.floor(Math.random() * replies.length)];
            addMessage(reply, 'left');
        }, 600 + Math.random() * 600);
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    // ===== AI切换（UI演示） =====
    let aiMode = false;
    aiToggle.addEventListener('click', function() {
        aiMode = !aiMode;
        this.textContent = aiMode ? '✨' : '📖';
        this.style.borderColor = aiMode ? 'rgba(197,164,126,0.8)' : 'rgba(255,255,255,0.2)';
        this.style.boxShadow = aiMode ? '0 0 16px rgba(197,164,126,0.2)' : 'none';
        addMessage(aiMode ? '✨ 已切换到 AI 模式' : '📖 已切换到字卡模式', 'system');
    });

    // ===== 主题切换 =====
    let dark = true;
    document.getElementById('themeToggle').addEventListener('click', function() {
        dark = !dark;
        const bg = dark ? '#121217' : '#f0ece6';
        const chatBg = dark ? '#121217' : '#f5f0ea';
        const text = dark ? '#e8e8ed' : '#1a1a1e';
        document.getElementById('app').style.background = bg;
        chatBox.style.background = chatBg;
        chatBox.style.color = text;
        document.querySelector('.header').style.background = dark ? '#1a1a1e' : '#e8e0d8';
        document.querySelector('.input-area').style.background = dark ? '#1a1a1e' : '#e8e0d8';
        document.querySelectorAll('.message.left').forEach(el => {
            el.style.background = dark ? '#26262b' : '#e0d8d0';
            el.style.color = dark ? '#e8e8ed' : '#1a1a1e';
        });
        document.querySelectorAll('.message.right').forEach(el => {
            el.style.background = dark ? '#2b6c8f' : '#b5c9d9';
            el.style.color = dark ? '#fff' : '#1a1a1e';
        });
        this.innerHTML = dark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    });

    // ============================================================
    // 🎮 游戏模块逻辑（和之前一样，整合在这里）
    // ============================================================
    const drawer = document.getElementById('funDrawer');
    document.getElementById('fdClose').addEventListener('click', function() {
        drawer.style.display = 'none';
    });

    // Tab切换
    const tabs = drawer.querySelectorAll('.fd-tab');
    const panels = {
        rps: document.getElementById('fdRps'),
        bomb: document.getElementById('fdBomb'),
        goban: document.getElementById('fdGoban'),
        moments: document.getElementById('fdMoments'),
        redpacket: document.getElementById('fdRedpacket')
    };
    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            tabs.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const key = this.dataset.tab;
            Object.keys(panels).forEach(k => {
                panels[k].classList.toggle('active', k === key);
            });
        });
    });

    // 猜拳
    const rpsMap = { rock: '✊', scissors: '✌️', paper: '🖐️' };
    const rpsBeats = { rock: 'scissors', scissors: 'paper', paper: 'rock' };
    const rpsResult = document.getElementById('rpsResult');
    drawer.querySelectorAll('.fd-rps button').forEach(btn => {
        btn.addEventListener('click', function() {
            const player = this.dataset.move;
            const moves = ['rock', 'scissors', 'paper'];
            const ai = moves[Math.floor(Math.random() * moves.length)];
            const pEmoji = rpsMap[player];
            const aEmoji = rpsMap[ai];
            let result = '';
            if (player === ai) result = '🤝 平局！';
            else if (rpsBeats[player] === ai) result = '🎉 你赢了！';
            else result = '😅 他赢了...';
            rpsResult.textContent = `${pEmoji} vs ${aEmoji} → ${result}`;
            addMessage(`✊ 猜拳：你出${pEmoji}，他出${aEmoji}，${result}`, 'system');
        });
    });

    // 数字炸弹
    let bombNum = Math.floor(Math.random() * 100) + 1;
    let bombMin = 1, bombMax = 100;
    const bombInput = document.getElementById('bombInput');
    const bombGuess = document.getElementById('bombGuess');
    const bombReset = document.getElementById('bombReset');
    const bombRange = document.getElementById('bombRange');
    const bombResult = document.getElementById('bombResult');

    function resetBomb() {
        bombNum = Math.floor(Math.random() * 100) + 1;
        bombMin = 1; bombMax = 100;
        bombRange.textContent = '1 ~ 100';
        bombResult.textContent = '新的一局';
        bombInput.value = '';
        bombInput.disabled = false;
        bombGuess.disabled = false;
    }
    bombGuess.addEventListener('click', function() {
        const guess = parseInt(bombInput.value);
        if (isNaN(guess) || guess < bombMin || guess > bombMax) {
            bombResult.textContent = `请输入 ${bombMin}~${bombMax}`;
            return;
        }
        if (guess === bombNum) {
            bombResult.textContent = `💥 爆炸！数字是 ${bombNum}！`;
            addMessage(`💥 数字炸弹爆炸！数字是 ${bombNum}，你输了！`, 'system');
            bombInput.disabled = true;
            this.disabled = true;
            return;
        }
        if (guess < bombNum) {
            bombMin = Math.max(bombMin, guess + 1);
            bombResult.textContent = `⬆️ 太小，${bombMin}~${bombMax}`;
        } else {
            bombMax = Math.min(bombMax, guess - 1);
            bombResult.textContent = `⬇️ 太大，${bombMin}~${bombMax}`;
        }
        bombRange.textContent = `${bombMin} ~ ${bombMax}`;
        bombInput.value = '';
    });
    bombReset.addEventListener('click', resetBomb);
    resetBomb();

    // 五子棋
    const size = 15;
    let board = [];
    let turn = 'player';
    let over = false;
    const gobanBoard = document.getElementById('gobanBoard');
    const gobanTurn = document.getElementById('gobanTurn');

    function initGoban() {
        board = Array.from({ length: size }, () => Array(size).fill(null));
        turn = 'player';
        over = false;
        gobanTurn.textContent = '你的回合';
        renderGoban();
    }

    function renderGoban() {
        gobanBoard.innerHTML = '';
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const cell = document.createElement('div');
                cell.className = 'fd-cell';
                const val = board[r][c];
                if (val === 'player') cell.textContent = '⚫';
                else if (val === 'ai') cell.textContent = '⚪';
                else if (!over && turn === 'player') {
                    cell.style.cursor = 'pointer';
                    cell.addEventListener('click', function() {
                        const rr = parseInt(this.dataset.r) || r;
                        const cc = parseInt(this.dataset.c) || c;
                        if (board[rr][cc] || over || turn !== 'player') return;
                        board[rr][cc] = 'player';
                        renderGoban();
                        if (checkWin(rr, cc, 'player')) {
                            gobanTurn.textContent = '🎉 你赢了！';
                            addMessage('🎉 五子棋：你赢了！', 'system');
                            over = true;
                            return;
                        }
                        turn = 'ai';
                        gobanTurn.textContent = '他思考中...';
                        setTimeout(aiMove, 350);
                    });
                }
                cell.dataset.r = r;
                cell.dataset.c = c;
                gobanBoard.appendChild(cell);
            }
        }
    }

    function aiMove() {
        if (over) return;
        const empty = [];
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (!board[r][c]) empty.push([r, c]);
            }
        }
        if (empty.length === 0) {
            gobanTurn.textContent = '🤝 平局！';
            addMessage('🤝 五子棋：平局！', 'system');
            over = true;
            return;
        }
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        board[r][c] = 'ai';
        renderGoban();
        if (checkWin(r, c, 'ai')) {
            gobanTurn.textContent = '😅 他赢了...';
            addMessage('😅 五子棋：他赢了...', 'system');
            over = true;
            return;
        }
        turn = 'player';
        gobanTurn.textContent = '你的回合';
    }

    function checkWin(r, c, player) {
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        for (const [dr, dc] of dirs) {
            let count = 1;
            for (const dir of [1, -1]) {
                for (let step = 1; step < 5; step++) {
                    const nr = r + dr * step * dir;
                    const nc = c + dc * step * dir;
                    if (nr < 0 || nr >= size || nc < 0 || nc >= size) break;
                    if (board[nr][nc] === player) count++;
                    else break;
                }
            }
            if (count >= 5) return true;
        }
        return false;
    }
    document.getElementById('gobanReset').addEventListener('click', initGoban);
    initGoban();

    // 朋友圈
    let moments = JSON.parse(localStorage.getItem('moments_data') || '[]');
    const momentsList = document.getElementById('momentsList');
    const momentInput = document.getElementById('momentInput');
    const momentSendBtn = document.getElementById('momentSendBtn');
    const momentImgBtn = document.getElementById('momentImgBtn');
    const momentFileInput = document.getElementById('momentFileInput');
    let pendingImage = null;

    function renderMoments() {
        momentsList.innerHTML = '';
        if (moments.length === 0) {
            momentsList.innerHTML = '<div style="color:#666;font-size:11px;text-align:center;padding:8px 0;">还没有动态 ✨</div>';
            return;
        }
        const sorted = [...moments].reverse();
        sorted.forEach(item => {
            const div = document.createElement('div');
            div.className = 'moment-item';
            const textEl = document.createElement('div');
            textEl.className = 'moment-text';
            textEl.textContent = item.text || '📷 图片动态';
            div.appendChild(textEl);
            if (item.image) {
                const img = document.createElement('img');
                img.className = 'moment-img';
                img.src = item.image;
                div.appendChild(img);
            }
            const time = document.createElement('span');
            time.className = 'moment-time';
            time.textContent = item.time || new Date().toLocaleString();
            div.appendChild(time);
            momentsList.appendChild(div);
        });
    }

    momentImgBtn.addEventListener('click', function() { momentFileInput.click(); });
    momentFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            pendingImage = ev.target.result;
            momentImgBtn.textContent = '✅';
            setTimeout(() => { momentImgBtn.textContent = '📎'; }, 2000);
        };
        reader.readAsDataURL(file);
    });

    momentSendBtn.addEventListener('click', function() {
        const text = momentInput.value.trim();
        if (!text && !pendingImage) return;
        moments.push({
            text: text || '📷 图片动态',
            image: pendingImage || null,
            time: new Date().toLocaleString()
        });
        localStorage.setItem('moments_data', JSON.stringify(moments));
        momentInput.value = '';
        pendingImage = null;
        renderMoments();
        addMessage(`📱 你发了一条朋友圈：${text || '📷 图片'}`, 'system');
    });
    renderMoments();

    // 红包
    const rpInput = document.getElementById('rpInput');
    const rpSendBtn = document.getElementById('rpSendBtn');
    const rpAmountDisplay = document.getElementById('rpAmountDisplay');

    rpInput.addEventListener('input', function() {
        const val = parseFloat(this.value);
        rpAmountDisplay.textContent = (!isNaN(val) && val > 0) ? `¥ ${val.toFixed(2)}` : '¥ 0.00';
    });

    rpSendBtn.addEventListener('click', function() {
        const val = parseFloat(rpInput.value);
        if (isNaN(val) || val <= 0) {
            alert('请输入有效金额');
            return;
        }
        addMessage(`🧧 你发了一个红包：¥${val.toFixed(2)}`, 'system');
        setTimeout(() => {
            const msgs = [
                `🧧 他拆开了你的红包：¥${val.toFixed(2)} ✦`,
                `🧧 他收到了你的心意：¥${val.toFixed(2)} ❤️`,
                `🧧 红包已领取：¥${val.toFixed(2)} 😊`
            ];
            addMessage(msgs[Math.floor(Math.random() * msgs.length)], 'system');
        }, 600 + Math.random() * 800);
        rpInput.value = '';
        rpAmountDisplay.textContent = '¥ 0.00';
    });

    console.log('✅ 完整版传讯已加载');
})();
</script>
</body>
</html>
